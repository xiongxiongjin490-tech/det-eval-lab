[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "det-eval-lab"
version = "0.1.0"
description = "Independent IoU, PR-curve and mAP@0.5 evaluation for object detection results"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
det-eval = "det_eval_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["det_eval_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
